name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and debug build
        run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Verify the release manifest requests no system permissions
        run: |
          ./gradlew :app:processReleaseMainManifest
          # AndroidX adds one app-private signature permission; any android.permission.* is a failure.
          if grep -R "uses-permission" app/build/intermediates/merged_manifest/release | grep "android.permission."; then
            echo "Release manifest must not request system permissions" && exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
