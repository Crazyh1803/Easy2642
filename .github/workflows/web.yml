name: Web app

on:
  push:
    branches: [main, web]
    paths: ['web/**', 'app/src/main/assets/forms/**', 'docs/store/icon-512.png', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'app/src/main/assets/forms/**', 'docs/store/icon-512.png', '.github/workflows/web.yml']

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Browser test (Chromium, fake camera)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-e2e-output
          path: web/e2e/out
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  # Publishes to GitHub Pages from main only. Requires Pages to be enabled once:
  # repository Settings > Pages > Build and deployment > Source: "GitHub Actions".
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
